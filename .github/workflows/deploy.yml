name: Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - ajt
      - main
    paths:
      - apps/web/**
jobs:
  build:
    name: Build and deploy
    #if: >-
    #  startsWith(github.event.head_commit.message, 'feat') ||
    #  startsWith(github.event.head_commit.message, 'fix') ||
    #  startsWith(github.event.head_commit.message, 'perf')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Postinstall steps
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web
        #env:
        #  VITE_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        #  VITE_ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # https://github.com/AnimMouse/setup-rclone/tree/main?tab=readme-ov-file#usage
      # Encode the rclone.conf file in Base64 using this command: `base64 -w 0 rclone.conf`
      # and paste it to RCLONE_CONFIG secret.
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@ef6294e97b6f0cbeb6f1a682a15d35a91dd5d0ff
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Rclone from pwd to remote
        shell: bash
        working-directory: apps/web
        run: >-
          rclone -v sync --fast-list --checksum
          "$PWD/build" "s3-connect:reader.ajatt.top"
          --exclude ".git/"
          --delete-excluded
