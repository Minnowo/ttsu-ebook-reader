name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Postinstall steps
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Zip build output
        # zip the *contents* of build/ (not the folder itself) so index.html
        # ends up at the root of the archive
        run: |
          cd apps/web/build
          zip -r "${{ github.workspace }}/ttu-reader-${{ github.ref_name }}.zip" .

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "ttu-reader-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
